# Replace GITHUBUSER, POOLNAME and the Paperless consume path.
# The ghcr.io package must be public or TrueNAS must have registry credentials.
services:
  duplex-merge:
    image: ghcr.io/GITHUBUSER/duplex-merge:latest
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      POLL_SECONDS: '5'
      MIN_AGE_SECONDS: '15'
      REVERSE_BACK: 'true'
    volumes:
      - /mnt/POOLNAME/Apps/DuplexMerge/front:/data/front
      - /mnt/POOLNAME/Apps/DuplexMerge/back:/data/back
      - /mnt/POOLNAME/Apps/DuplexMerge/archive:/data/archive
      - /mnt/POOLNAME/Apps/DuplexMerge/error:/data/error
      - /mnt/POOLNAME/Apps/Paperless/Consume:/data/output
